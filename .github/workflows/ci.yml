name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/training2
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build fixed development runtime
        run: docker build -t training2-ci infra/docker
      - name: Start local authentication emulator
        run: |
          docker run -d --rm --network host --name training2-cognito-ci \
            -v "${{ github.workspace }}/.devcontainer/cognito/config.json:/training2-config.json:ro" \
            --entrypoint /bin/sh jagregory/cognito-local:5.3.0 \
            -c 'cp /training2-config.json /app/.cognito/config.json && node /app/start.js'
      - name: Install and run project checks inside container
        run: |
          docker run --rm --user root --network host --add-host cognito-local:127.0.0.1 \
            -e CI=true -e HUSKY=0 -e NODE_ENV=test -e DATABASE_URL -e COGNITO_LOCAL_ENDPOINT=http://cognito-local:9229 -e PLAYWRIGHT_BROWSERS_PATH=/opt/playwright -e API_BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}" \
            -v "${{ github.workspace }}:/workspaces/training2" \
            training2-ci bash -lc 'pnpm install --frozen-lockfile && pnpm seed:cognito && pnpm db:migrate && pnpm db:seed && pnpm prisma:check && pnpm codegen:check && pnpm screen:check && pnpm check && pnpm exec playwright install --with-deps chromium && pnpm test:e2e && pnpm db:schema:check && git config --global --add safe.directory /workspaces/training2 && if [ -n "$API_BASE_REF" ] && [ "$API_BASE_REF" != 0000000000000000000000000000000000000000 ]; then bash tools/scripts/check-openapi-breaking.sh "$API_BASE_REF"; fi'
