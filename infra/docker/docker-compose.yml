name: training2

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: training2
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d training2"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - training2

volumes:
  postgres-data:

networks:
  training2:
